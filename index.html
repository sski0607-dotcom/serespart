<body><main>
<h1>🍵 필보 파티모집</h1>
<div class="sub">6층 필드보스 재료 · 재료별 1파티(최대 4명) · 매일 0시(KST) 자동 초기화 · <span id="cd"></span></div>
<div class="lgrow"><div class="legend" id="legend"></div><button id="adm">🔑 관리자</button><button id="addg" hidden>+ 길드 추가 / 색 변경</button><button id="lbtn" hidden>변경 기록</button><button id="mgr" hidden>닉네임 관리</button><button id="acb" hidden>접근 관리</button><button id="lo" hidden>로그아웃</button></div>

<div id="note"></div>
<div class="tabs"><button id="t0" class="on">오전</button><button id="t1">오후</button><button id="t3">통계</button><button id="t4">기록</button><button id="t2">건의사항</button></div>
<div class="grid" id="grid"></div>
<div id="rec" class="st" hidden>
  <div class="card" id="st1"></div>
  <div class="card" id="st2"></div>
  <div class="card" id="st3"></div>
  <div class="card" id="st4"></div>
</div>
<div id="his" hidden>
  <div class="card">
    <div class="recnav"><button id="hprev">◀</button><b id="hday"></b><button id="hnext">▶</button><button id="htoday">오늘</button></div>
    <input type="text" id="hq" placeholder="닉네임 검색 (최근 60일 전체에서 찾아요)" autocomplete="off">
    <div class="sub" id="hsum" style="margin:8px 0 0"></div>
  </div>
  <div id="hl"></div>
</div>
<div id="sug" hidden>
  <div class="card">
    <b>건의사항</b>

    <input type="text" id="sn" maxlength="20" placeholder="닉네임 (선택)" autocomplete="off">
    <textarea id="sb" maxlength="500" rows="3" placeholder="건의 내용 (최대 500자)"></textarea>

<dialog id="mdlg">

<div class="ml" id="ml"></div>
<div class="row"><button id="mclose">닫기</button></div>
</dialog>
<dialog id="gdlg">

<label>길드</label><select id="gs"></select>
<div id="wm" hidden><label>원하는 재료 (선택 · 비우면 아무거나)</label><div class="chk" id="wmc"></div></div>
<div id="derr" style="color:#c0392b;font-size:12px;margin-top:6px"></div>
<div class="row"><button id="cancel">취소</button><button class="go" id="save">참가</button></div>
</dialog>
</main>

<div id="acl"></div>
<div class="row"><button id="acref">새로고침</button><button id="acclose" class="go">닫기</button></div>
</dialog>

async function fetchLogs(from,to){

async function drawHisDay(){

  if(error)throw error;
  const rows=(data||[]).map(r=>({H:hourOf(r.id),d:parseD(r.data)})).filter(r=>r.H>=0&&hasData(r.d)).sort((a,b)=>a.H-b.H);

    MATS.forEach((mn,x)=>{const ms=(d.p||[])[x]||[];if(!ms.length)return;ms.forEach(m=>people.add(m.n.toLowerCase()));
      h+=`<div class="hr"><span>${mn}</span><span>${ms.map(m=>chip(esc(m.n),m.g)).join(" ")}</span>${(d.s||[])[x]?`<span class="sub" style="margin:0">제출 ${esc(d.s[x])}</span>`:""}</div>`});
    if((d.w||[]).length){d.w.forEach(m=>people.add(m.n.toLowerCase()));h+=`<div class="hr"><span>대기</span><span>${d.w.map(m=>chip(esc(m.n),m.g)).join(" ")}</span></div>`}
    return h+"</div>"}).join(""):'<div class="sub">이 날은 기록이 없어요. (기록은 schema_v10.sql 을 실행한 시점부터 쌓여요)</div>';

  $("hsum").textContent=rows.length?`참가 ${people.size}명 · ${rows.length}개 시간대${c+m?` · 잡음 ${c} / 못 잡음 ${m}`:""}`:"";

async function drawHisSearch(q){
  const to=today(),from=dAdd(to,-60);
  const [{data,error},logs]=await Promise.all([sb.from("board_history").select("id,day,data").gte("day",from).lte("day",to).limit(2000),fetchLogs(from,to)]);
  if(error)throw error;
  const hits=[];
  (data||[]).forEach(r=>{const H=hourOf(r.id),d=parseD(r.data);if(H<0||!d)return;
    MATS.forEach((mn,x)=>((d.p||[])[x]||[]).forEach(m=>{if(m.n.toLowerCase().includes(q))hits.push({day:r.day,H,mat:mn,m,c:d.c})}));
    (d.w||[]).forEach(m=>{if(m.n.toLowerCase().includes(q))hits.push({day:r.day,H,mat:"대기",m,c:d.c})})});
  hits.sort((a,b)=>a.day===b.day?b.H-a.H:a.day<b.day?1:-1);
  $("hday").textContent="닉네임 검색";$("hnext").disabled=$("htoday").disabled=true;
  const joined=hits.filter(h=>h.mat!=="대기"),c=joined.filter(h=>(logs[h.day+"_"+h.H]||{}).result==="caught").length,m=joined.filter(h=>(logs[h.day+"_"+h.H]||{}).result==="missed").length;
  $("hsum").textContent=hits.length?`최근 60일 · 파티 참가 ${joined.length}회 · 대기 ${hits.length-joined.length}회${c+m?` · 잡은 파티 ${c} / 못 잡은 파티 ${m}`:""}`:"";
  $("hl").innerHTML=hits.length?hits.slice(0,300).map(h=>{const lg=logs[h.day+"_"+h.H],ch=h.c||(lg&&lg.channel)||0;
    return `<div class="hs"><div class="hh"><b>${h.day.slice(5).replace("-","/")} ${hLab(h.H)}</b><span class="tg">${h.mat}</span>${ch?`<span class="tg">${ch}채널</span>`:""}${resTag(lg)}<span>${chip(esc(h.m.n),h.m.g)}</span></div></div>`}).join(""):'<div class="sub">검색 결과가 없어요.</div>';
}

const bossMM=()=>boss?p2(new Date(boss.t+9*3600e3).getUTCMinutes()):"--";
// 현재 보고 있는 날짜/오전·오후/시 카드가 필보 시각과 일치할 때만 true
const bossHit=i=>{if(!boss)return false;const k=new Date(boss.t+9*3600e3),H=k.getUTCHours();return k.toISOString().slice(0,10)===day&&period===(H>=12?1:0)&&i===(H%12||12)};
const tl=i=>bossHit(i)?`${hr(i)}:${bossMM()}`:`${hr(i)}시`;
function ago(ms){const m=Math.floor(ms/60000);return m<1?"방금 전":m<60?m+"분 전":Math.floor(m/60)+"시간 전"}
function drawBoss(){
  const el=$("boss");if(!boss){return}
  const k=new Date(boss.t+9*3600e3),h=k.getUTCHours(),ap=h<12?"오전":"오후",left=Math.round((boss.t-Date.now())/1000);
  const at=`${ap} ${p2(h%12===0&&h>=12?12:h%12)}:${p2(k.getUTCMinutes())}`;
  const st=left>0?`다음 필보 소환까지 <b>${p2(Math.floor(left/3600))}:${p2(Math.floor(left%3600/60))}:${p2(left%60)}</b> (${at} 소환 가능)`:`🟢 <b>지금 봉헌 가능</b> (${at} 확인)`;
  el.innerHTML=`⏳ ${st}<br><small>${esc(boss.by)} 님 모드가 ${ago(Date.now()-boss.u)} 알려줌 · 자동 갱신</small>`;
}
let bossSeen=false;
function markTabs(){
  let hp=-1;if(boss){const k=new Date(boss.t+9*3600e3);if(k.toISOString().slice(0,10)===day)hp=k.getUTCHours()>=12?1:0}
  $("t0").textContent="오전"+(hp===0?" ⏳":"");$("t1").textContent="오후"+(hp===1?" ⏳":"");
  if(hp>=0&&!bossSeen){bossSeen=true;if(period!==hp&&!$("grid").hidden)showTab(hp)}
}
async function loadBoss(){
  try{const {data}=await sb.from("boss_timer").select("*").eq("id",1).maybeSingle();
    if(data&&data.ready_at){const t=Date.parse(data.ready_at),old=boss&&boss.t;boss={t,by:data.reporter||"알 수 없음",u:Date.parse(data.updated_at)};if(old!==t){markTabs();render()}}}catch(e){}
}
let lastAv=null;
function tick(){
  drawBoss();
  {const av=!!boss&&boss.t<=Date.now();if(av!==lastAv){lastAv=av;render()}}
  const d=kst(),left=86400-(d.getUTCHours()*3600+d.getUTCMinutes()*60+d.getUTCSeconds());
  $("cd").textContent=`초기화까지 ${String(Math.floor(left/3600)).padStart(2,"0")}:${String(Math.floor(left%3600/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}`;
  if(today()!==day){day=today();slots={};recData={};render();loadToday()}
}
setInterval(tick,1000);tick();render();
const TOMB="__deleted__";
function dropName(n){const k=n.toLowerCase();for(let i=names.length-1;i>=0;i--)if(names[i].toLowerCase()===k)names.splice(i,1);fillNames()}
function applyMember(v){
  if(!v||!v.n||!v.g)return;const k=String(v.n).toLowerCase();
  if(v.g===TOMB){delete guildOf[k];dropName(String(v.n))}else{guildOf[k]=v.g;addName(String(v.n))}
}
const gopts=cur=>Object.keys(GC).map(x=>`<option value="${esc(x)}"${x===cur?" selected":""}>${esc(x)}</option>`).join("");
function drawM(){
  const q=$("mq").value.trim().toLowerCase();
  const arr=names.filter(n=>n.toLowerCase().includes(q)).sort((a,b)=>a.localeCompare(b));
  $("ml").innerHTML=arr.map(n=>`<div class="mi"><span class="nm">${chip(esc(n),guildOf[n.toLowerCase()])}</span><select data-n="${esc(n)}">${gopts(guildOf[n.toLowerCase()])}</select><button class="x" data-del="${esc(n)}" title="삭제">×</button></div>`).join("")||'<div class="sub">결과 없음</div>';
  $("mcount").textContent=`(${names.length}명)`;
}
$("mgr").onclick=()=>{$("mg").innerHTML=gopts("타길드");$("mq").value="";drawM();$("mdlg").showModal()};
$("mq").oninput=drawM;
$("mclose").onclick=()=>$("mdlg").close();
$("ml").onchange=e=>{const n=e.target.dataset.n;if(!n)return;guildOf[n.toLowerCase()]=e.target.value;saveMember(n,e.target.value);drawM()};
$("ml").onclick=e=>{const n=e.target.dataset.del;if(!n)return;if(!confirm(`${n} 닉네임을 삭제할까요?`))return;delete guildOf[n.toLowerCase()];dropName(n);saveMember(n,TOMB);drawM()};
$("madd").onclick=()=>{const n=$("mn").value.trim();if(!n)return;const g=$("mg").value;guildOf[n.toLowerCase()]=g;addName(n);saveMember(n,g);$("mn").value="";drawM()};
const gid=n=>"g_"+[...n].map(c=>c.codePointAt(0).toString(16)).join("-");
const isHex=v=>typeof v==="string"&&/^#[0-9a-f]{6}$/i.test(v);
const normHex=v=>{v=v.trim();if(v&&v[0]!=="#")v="#"+v;return v};
function gpv(){const n=$("gn").value.trim()||"길드명";$("gpv").innerHTML=chip(esc(n),"__x");const c=$("gpv").firstChild;if(isHex(normHex($("bgt").value)))c.style.background=normHex($("bgt").value);if(isHex(normHex($("fgt").value)))c.style.color=normHex($("fgt").value)}
function openG(name){
  const c=GC[name]||["#E2E8F0","#475569"];
  $("gn").value=name||"";$("bgt").value=c[0];$("fgt").value=c[1];$("bgp").value=c[0].toLowerCase();$("fgp").value=c[1].toLowerCase();
  $("gerr").textContent="";$("gdel").hidden=!(name&&GC[name]&&!DEFAULTS.has(name));gpv();$("gdlg").showModal();
}
$("addg").onclick=()=>openG("");
$("legend").onclick=e=>{const t=e.target.closest(".lg");if(t&&ADMIN_PW)openG(t.dataset.g)};
$("gn").oninput=gpv;
[["bgp","bgt"],["fgp","fgt"]].forEach(([p,t])=>{$(p).oninput=()=>{$(t).value=$(p).value;gpv()};$(t).oninput=()=>{const v=normHex($(t).value);if(isHex(v))$(p).value=v.toLowerCase();gpv()}});
$("gcancel").onclick=()=>$("gdlg").close();
$("gsave").onclick=async()=>{
  const n=$("gn").value.trim(),bg=normHex($("bgt").value),fg=normHex($("fgt").value);
  if(!n||n.length>12){$("gerr").textContent="길드 이름은 1~12자로 입력해 주세요.";return}
  if(!isHex(bg)||!isHex(fg)){$("gerr").textContent="색상은 #RRGGBB 형식(예: #FFFAD3)으로 입력해 주세요.";return}
  GC[n]=[bg,fg];refreshGuilds(true);$("gdlg").close();
  {const {error}=await sb.rpc("admin_upsert_guild",{pw:ADMIN_PW,p_id:gid(n),p_name:n,p_bg:bg,p_fg:fg,p_actor:ADMIN_NAME});if(error)$("note").textContent="길드 저장 실패: 관리자 권한을 확인해 주세요."}
};
$("gdel").onclick=async()=>{
  const n=$("gn").value.trim();if(!n||DEFAULTS.has(n))return;
  delete GC[n];refreshGuilds(true);$("gdlg").close();
  await sb.rpc("admin_delete_guild",{pw:ADMIN_PW,p_id:gid(n),p_actor:ADMIN_NAME});
};
let ADMIN_PW="",ADMIN_NAME="";
try{ADMIN_NAME=localStorage.getItem("admn")||""}catch(e){}
try{ADMIN_PW=localStorage.getItem("adm")||""}catch(e){}
const clearAdm=()=>{ADMIN_PW="";try{localStorage.removeItem("adm")}catch(e){}};
function setAdmin(on){$("addg").hidden=$("mgr").hidden=$("lbtn").hidden=$("acb").hidden=!on;$("adm").textContent=on?"🔓 관리자 모드 끄기":"🔑 관리자";drawSug()}
async function checkAdmin(pw){try{const {data,error}=await sb.rpc("admin_check",{pw});return !error&&data===true}catch(e){return false}}
$("adm").onclick=async()=>{
  if(ADMIN_PW){clearAdm();setAdmin(false);return}
  const pw=prompt("관리자 비밀번호를 입력하세요");if(!pw)return;
  if(await checkAdmin(pw)){
    ADMIN_PW=pw;try{localStorage.setItem("adm",pw)}catch(e){}
    ADMIN_NAME=(prompt("관리자 이름을 입력하세요 (변경 기록에 표시돼요)",ADMIN_NAME)||"관리자").trim().slice(0,20);
    try{localStorage.setItem("admn",ADMIN_NAME)}catch(e){}
    setAdmin(true);$("note").textContent=""}
  else $("note").textContent="비밀번호가 맞지 않습니다.";
};
setAdmin(false);
const restoreAdmin=()=>{if(ADMIN_PW)checkAdmin(ADMIN_PW).then(ok=>{if(ok)setAdmin(true);else clearAdm()})};
async function showLog(){
  $("ll").textContent="불러오는 중…";
  const {data,error}=await sb.rpc("admin_get_log",{pw:ADMIN_PW});
  if(error||!data){$("ll").textContent="기록을 불러오지 못했습니다. SQL(schema_v3)을 실행했는지 확인해 주세요.";return}
  const f=t=>new Date(t).toLocaleString("ko-KR",{timeZone:"Asia/Seoul",hour12:false,month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"});
  $("ll").innerHTML=data.length?data.map(r=>`<div class="li"><span class="t">${f(r.ts)}</span><b>${esc(r.actor)}</b> · ${esc(r.action)} · <b>${esc(r.target)}</b> ${esc(r.detail||"")}</div>`).join(""):"아직 기록이 없어요.";
}
$("lbtn").onclick=()=>{$("ldlg").showModal();showLog()};
$("lref").onclick=showLog;
$("lclose").onclick=()=>$("ldlg").close();
const fail=()=>{$("note").textContent=offlineMsg||"서버 연결 오류: Supabase 설정을 확인해 주세요."};
async function loadGuilds(){
  const {data,error}=await sb.from("guilds").select("*");if(error||!data){fail();return}
  const have=new Set();
  data.forEach(v=>{if(typeof v.name==="string"&&isHex(v.bg)&&isHex(v.fg)){GC[v.name]=[v.bg,v.fg];have.add(v.name)}});
  Object.keys(GC).forEach(g=>{if(!DEFAULTS.has(g)&&!have.has(g))delete GC[g]});
  refreshGuilds(true);
}
async function loadMembers(){
  const {data,error}=await sb.from("members").select("*");if(error||!data)return;
  data.forEach(v=>applyMember(v));
}
async function loadBoard(){
  const {data,error}=await sb.from("board").select("*");if(error||!data){fail();return}
  const nx={};let stale=false;
  data.forEach(r=>{if(r.date!==day){stale=true;return}try{nx[r.id]=JSON.parse(r.data)}catch(e){}});
  slots=nx;render();
  if(stale)sb.from("board").delete().neq("date",day).then(()=>{});
}
const loadAll=()=>{loadGuilds();loadMembers();loadBoard();loadBoss();loadToday()};
let started=false;
function startApp(){
  if(started)return;started=true;
  loadAll();restoreAdmin();
  setInterval(loadBoss,15000);
  sb.channel("party")
    .on("postgres_changes",{event:"*",schema:"public",table:"board"},loadBoard)
    .on("postgres_changes",{event:"*",schema:"public",table:"guilds"},loadGuilds)
    .on("postgres_changes",{event:"*",schema:"public",table:"members"},loadMembers)
    .on("postgres_changes",{event:"*",schema:"public",table:"boss_timer"},loadBoss)
    .on("postgres_changes",{event:"*",schema:"public",table:"boss_log"},()=>{loadToday();if(!$("rec").hidden)loadStats()})
    .on("postgres_changes",{event:"*",schema:"public",table:"suggestions"},()=>{if(!$("sug").hidden)loadSug()})
    .subscribe();
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)loadAll()});
}
// ───── 디스코드 로그인 + 승인 명단 ─────
const gateBox=h=>{$("gate").hidden=false;$("gate").innerHTML=`<div class="gb"><h1>🍵 필보 파티모집</h1>${h}</div>`};
const logout=async()=>{try{await sb.auth.signOut()}catch(e){}location.reload()};
async function discordLogin(){
  const {error}=await sb.auth.signInWithOAuth({provider:"discord",options:{redirectTo:location.origin+location.pathname}});
  if(error)alert("로그인을 시작하지 못했어요: "+error.message);
}
function showLogin(msg){
  gateBox(`<p>${msg||"길드원 전용 페이지예요.<br>디스코드로 로그인하면 승인 후 이용할 수 있어요."}</p><button class="dc" id="gdc">디스코드로 로그인</button>`);
  $("gdc").onclick=discordLogin;
}
function showWaiting(name){
  gateBox(`<p><b>${esc(name||"")}</b> 님, 로그인되었어요.<br>관리자가 승인하면 바로 사용할 수 있어요. 승인 요청은 이미 전달됐어요.</p>
    <button id="gchk" class="dc">승인됐는지 확인</button><button id="gadm">🔑 관리자 (직접 승인)</button><button id="glo">다른 계정으로 로그인</button>`);
  $("gchk").onclick=gateCheck;$("glo").onclick=logout;
  $("gadm").onclick=async()=>{if(await ensureAdmin()){await openAccess()}};
}
async function gateCheck(){
  let session=null;
  try{({data:{session}}=await sb.auth.getSession())}catch(e){}
  if(!session){$("lo").hidden=true;showLogin();return}
  $("lo").hidden=false;
  const {data:ok,error}=await sb.rpc("is_allowed");
  if(error){gateBox(`<p>서버 확인에 실패했어요.<br>(schema_v8.sql 실행 여부를 확인해 주세요)</p><button id="gretry" class="dc">다시 시도</button><button id="glo">로그아웃</button>`);$("gretry").onclick=gateCheck;$("glo").onclick=logout;return}
  if(ok){$("gate").hidden=true;startApp();return}
  const md=session.user&&session.user.user_metadata||{};
  try{await sb.rpc("request_access")}catch(e){}
  showWaiting(md.custom_claims&&md.custom_claims.global_name||md.full_name||md.name);
}
async function ensureAdmin(){
  if(ADMIN_PW)return true;
  const pw=prompt("관리자 비밀번호를 입력하세요");if(!pw)return false;
  if(!(await checkAdmin(pw))){alert("비밀번호가 맞지 않습니다.");return false}
  ADMIN_PW=pw;try{localStorage.setItem("adm",pw)}catch(e){}
  if(!ADMIN_NAME)ADMIN_NAME="관리자";
  return true;
}
async function drawAccess(){
  $("acl").textContent="불러오는 중…";
  const {data,error}=await sb.rpc("admin_list_access",{pw:ADMIN_PW});
  if(error||!data){$("acl").textContent="불러오지 못했어요. (schema_v8.sql 실행 여부와 관리자 비밀번호를 확인해 주세요)";return}
  const row=(r,btns)=>`<div class="ai"><span class="nm">${esc(r.name||"이름 없음")}<small>${esc(r.discord_id)}</small></span>${btns}</div>`;
  $("acl").innerHTML=`<h5>승인 대기 (${data.requests.length})</h5>`+(data.requests.length?data.requests.map(r=>row(r,`<button class="ok" data-ap="${esc(r.discord_id)}">승인</button><button class="no" data-rj="${esc(r.discord_id)}">거절</button>`)).join(""):'<div class="sub">대기 중인 요청이 없어요.</div>')
    +`<h5>승인됨 (${data.allowed.length})</h5>`+(data.allowed.length?data.allowed.map(r=>row(r,`<button class="no" data-rm="${esc(r.discord_id)}">제거</button>`)).join(""):'<div class="sub">아직 없어요.</div>');
}
async function openAccess(){$("acdlg").showModal();await drawAccess()}
$("acb").onclick=openAccess;
$("acref").onclick=drawAccess;
$("acclose").onclick=()=>{$("acdlg").close();if(!$("gate").hidden)gateCheck()};
$("acl").onclick=async e=>{
  const t=e.target,ap=t.dataset.ap,rj=t.dataset.rj,rm=t.dataset.rm;
  if(!ap&&!rj&&!rm)return;
  if(rm&&!confirm("이 사람의 접근을 제거할까요?"))return;
  const fn=ap?"admin_approve_access":rj?"admin_reject_access":"admin_remove_access";
  const {error}=await sb.rpc(fn,{pw:ADMIN_PW,p_id:ap||rj||rm,p_actor:ADMIN_NAME||"관리자"});
  if(error)alert("처리하지 못했어요.");
  drawAccess();
};
$("lo").onclick=logout;
if(sb.auth){
  sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.reload()});
  gateCheck();
}else{$("gate").hidden=true;startApp()}
</script></body></html>
